name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test
      - run: npm run build

      # 若 Pages 曾被启用为「从分支部署」，先切成 Actions 构建源，否则会发布仓库里的
      # 原始 index.html（引用 /src/main.tsx），线上白屏。已正确配置时该步是幂等的。
      - name: Ensure Pages builds from GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$STATUS" = "404" ]; then
            echo "Pages 尚未启用，交由 configure-pages 处理"
          else
            BUILD_TYPE=$(python3 -c "import json;print(json.load(open('/tmp/pages.json')).get('build_type',''))")
            echo "当前 build_type=$BUILD_TYPE"
            if [ "$BUILD_TYPE" != "workflow" ]; then
              curl -s -X PUT \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                -d '{"build_type":"workflow"}' \
                "https://api.github.com/repos/${{ github.repository }}/pages"
              echo "已切换为 GitHub Actions 构建"
            fi
          fi

      - uses: actions/configure-pages@v5
        with:
          # 仓库尚未启用 Pages 时，用 GITHUB_TOKEN 自动按 "GitHub Actions" 方式启用
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
