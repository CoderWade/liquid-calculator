name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test
      - run: npm run build

      # 校验构建产物确实是打好的包，而不是仓库根目录的源码 index.html
      - name: Verify build output
        run: |
          if ! grep -q '/assets/index-.*\.js' dist/index.html; then
            echo "::error::dist/index.html 未引用打包后的 JS，构建可能失败"
            exit 1
          fi
          test -f dist/data/markets.json || { echo "::error::缺少 dist/data/markets.json"; exit 1; }
          echo "构建产物检查通过："
          ls -la dist dist/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
