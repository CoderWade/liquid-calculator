name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test
      - run: npm run build

      # Pages 若被启用为「从分支部署（legacy）」，GitHub 会直接发布仓库根目录的
      # 原始 index.html（引用 /src/main.tsx），线上白屏。这里切成 Actions 构建源。
      - name: Ensure Pages builds from GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          gh api "repos/${{ github.repository }}/pages" --jq '.build_type, .status' || true
          BUILD_TYPE=$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type' 2>/dev/null || echo '')
          echo "build_type=${BUILD_TYPE:-<none>}"
          if [ -n "$BUILD_TYPE" ] && [ "$BUILD_TYPE" != "workflow" ]; then
            echo '{"build_type":"workflow"}' \
              | gh api -X PUT "repos/${{ github.repository }}/pages" --input - > /tmp/put.json
            echo "PUT 结果："
            cat /tmp/put.json
          fi
          FINAL=$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type' 2>/dev/null || echo '')
          echo "切换后 build_type=${FINAL:-<none>}"
          if [ "$FINAL" != "workflow" ]; then
            echo "::error::Pages 仍不是 Actions 构建源（${FINAL:-unknown}），请在 Settings → Pages → Source 选择 GitHub Actions"
          fi

      - uses: actions/configure-pages@v5
        with:
          # 仓库尚未启用 Pages 时，用 GITHUB_TOKEN 自动按 "GitHub Actions" 方式启用
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
